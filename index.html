<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <meta name="description" content="Planejador de aulas de jiu-jítsu Budô">
  <title>Planos de aula · Budô</title>
  <link rel="icon" href="logobudo.jpeg">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar no-print">
    <div class="brand"><img src="logobudo.jpeg" alt="Budô"><div><strong>PLANO DE AULA</strong><span>JIU-JÍTSU · BUDÔ</span></div></div>
    <div class="top-actions"><button id="libraryToggle" class="button ghost mobile-only" type="button">☰ Planos</button><button id="saveButton" class="button ghost" type="button">Salvar</button><button id="printButton" class="button primary" type="button">↗ Exportar PDF</button></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar no-print" id="sidebar" aria-label="Planos salvos">
      <div class="sidebar-head"><div><span class="eyebrow">BIBLIOTECA</span><h2>Meus planos</h2></div><button id="closeSidebar" class="icon-button mobile-only" aria-label="Fechar planos" type="button">×</button></div>
      <button id="newPlan" class="button primary full" type="button">＋ Novo plano</button>
      <div id="planList" class="plan-list"></div>
      <div class="sidebar-foot"><button id="exportBackup" class="button subtle full" type="button">↓ Exportar backup</button><button id="importBackup" class="button subtle full" type="button">↑ Importar backup</button><input id="backupFile" type="file" accept="application/json,.json" hidden><p>Salvo neste navegador. Exporte um backup para usar em outro aparelho.</p></div>
    </aside>
    <div id="scrim" class="scrim no-print"></div>
    <main class="main">
      <div class="page-heading no-print"><div><span class="eyebrow">EDITOR DE AULAS</span><h1 id="pageTitle">Plano de aula</h1><p>Estruture, acompanhe e imprima sua aula.</p></div><div class="page-actions"><span id="saveStatus" class="save-status">Salvo</span><button id="duplicatePlan" class="button subtle" type="button">Duplicar</button><button id="deletePlan" class="button danger-text" type="button">Excluir</button></div></div>
      <div id="editor"></div>
    </main>
  </div>
  <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>
</body>
</html>
